<!DOCTYPE html>
<!-- Shared Luma layout: loads global styling/scripts and renders the authenticated navigation. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Luma - share the moments that stay with you">
    <title>{% block title %}Luma{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app.js" defer></script>
</head>
<body>

<!-- NAVBAR: current_user context variable se control hoga -->
{% if current_user %}
<nav class="navbar">
    <div class="nav-inner">
        <a href="/feed" class="nav-logo"><span class="brand-mark">✦</span> Luma</a>
        <div class="nav-links">
            <a href="/feed"><span>⌂</span> Feed</a>
            <a href="/profile" class="nav-username"><span class="nav-avatar">{{ current_user.username[0].upper() }}</span>{{ current_user.username }}</a>
            <a href="/profile-edit">Edit profile</a>
            <a href="/logout" class="logout-btn">Log out</a>
        </div>
    </div>
</nav>
{% endif %}

{% block content %}{% endblock %}

</body>
</html>
