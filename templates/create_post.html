{% extends "base.html" %}
<!-- Create-post page: accepts an image, caption, and CSRF token for a new post. -->
{% block title %}Create Post - Luma{% endblock %}

{% block content %}
<div class="auth-container">
    <div style="width:100%; max-width:500px;">
        <div class="auth-box" style="text-align:left;">
            <h2 style="font-size:1.2rem; font-weight:700; margin-bottom:1.5rem; text-align:center;">📷 New Post</h2>

            {% if error %}
            <div class="flash-error">⚠ {{ error }}</div>
            {% endif %}

            <form method="POST" action="/post/create" enctype="multipart/form-data">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="form-group">
                    <label>Image *</label>
                    <input type="file" name="image" accept="image/*" required
                           style="padding:0.5rem; cursor:pointer;">
                    <div style="font-size:0.78rem; color:var(--text-muted); margin-top:0.3rem;">JPG, PNG, GIF, WEBP allowed</div>
                </div>

                <div class="form-group">
                    <label>Caption</label>
                    <textarea name="caption" placeholder="Write a caption..." style="min-height:90px;"></textarea>
                </div>

                <div style="display:flex; gap:0.8rem; margin-top:0.5rem;">
                    <a href="/feed" class="btn-cancel" style="flex:1; text-align:center; padding:0.7rem;">Cancel</a>
                    <button type="submit" class="btn-primary" style="flex:2;">Share</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
